]

subprojects {
    plugins.withId("java") {
        def variant = project.path.substring(1).replace(":", "/")
        def sharedJavaDirs = sharedJavaLayers.findAll { it.value.contains(variant) }
                .collect { rootProject.file("common/src/${it.key}/java") }

        if (project.path.startsWith(":fabric:")) {
            afterEvaluate {
                sourceSets.client.java.srcDir(rootProject.file("common/src/main/java"))
                sourceSets.client.java.srcDirs(sharedJavaDirs)
                sourceSets.client.resources.srcDir(rootProject.file("common/src/main/resources"))

                tasks.matching { it.name.startsWith("run") }.configureEach {
                    doFirst {
                        layout.buildDirectory.dir("classes/java/main").get().asFile.mkdirs()
                        layout.buildDirectory.dir("resources/main").get().asFile.mkdirs()
                    }
                }
            }
        }

        if (project.path.startsWith(":neoforge:")) {
            sourceSets.main.java.srcDir(rootProject.file("common/src/main/java"))
            sourceSets.main.java.srcDirs(sharedJavaDirs)
            sourceSets.main.resources.srcDir(rootProject.file("common/src/main/resources"))
        }

        if (project.path.startsWith(":forge:")) {
            sourceSets.main.java.srcDir(rootProject.file("common/src/main/java"))
            sourceSets.main.java.srcDirs(sharedJavaDirs)
            sourceSets.main.resources.srcDir(rootProject.file("common/src/main/resources"))
            sourceSets.main.resources.srcDir(rootProject.file("neoforge/${forgeResourceVersion[variant]}/src/main/resources"))
        }
    }
}

