def mcVersionRanges = [
        "1.21": "1.21-1.21.1",
        "1.21.2": "1.21.2-1.21.4",
        "1.21.3": "1.21.2-1.21.4",
        "1.21.5": "1.21.5",
        "1.21.8" : "1.21.6-1.21.8",
        "1.21.10": "1.21.9-1.21.10",
        "1.21.11": "1.21.11",
        "26.1"   : "26.1-26.1.2",
        "26.2"   : "26.2"
]

tasks.register('updateModVersions') {
    doLast {
        versions.each { path ->
            def mcVersion = path.tokenize('/')[1]
            def file = file("${path}/gradle.properties")

            if (file.exists()) {

                def range = mcVersionRanges.getOrDefault(mcVersion, mcVersion)
                def newValue = "${modVersion}+${range}"

                def updated = file.text.replaceAll(
                        /mod_version=.*/,
                        "mod_version=${newValue}"
                )

                file.text = updated
            }
        }
    }
}

def rootBuildTasks = versions
        .findAll { !it.startsWith("forge/") }
        .collect { ":${it.replace('/', ':')}:build" }

def forgeBuildTasks = versions
        .findAll { it.startsWith("forge/") }
        .collect { ":${it.tokenize('/')[1]}:build" }

tasks.register('cleanBuilds', Delete) {
    group = "build"
    description = "Deletes collected release JARs from the root builds directory."
    delete layout.projectDirectory.dir("builds")
}

tasks.register('buildForgeAll', Exec) {
    group = "build"
    description = "Builds every Forge variant using the nested Forge Gradle build."
    workingDir file("forge")
    commandLine(["./gradlew"] + forgeBuildTasks + ["--no-daemon", "--configure-on-demand"])
}

tasks.register('buildAll') {
    group = "build"
    description = "Builds every loader and collects release JARs in builds/<loader>."

    dependsOn tasks.named('cleanBuilds')
    dependsOn rootBuildTasks
    dependsOn tasks.named('buildForgeAll')

    doLast {
        versions.each { variant ->
            def loader = variant.tokenize('/')[0]
            def propertiesFile = file("${variant}/gradle.properties")
            def variantProperties = new Properties()

            propertiesFile.withInputStream {
                variantProperties.load(it)
            }

            def expectedVersion = variantProperties.getProperty("mod_version")
            def candidates = fileTree("${variant}/build/libs") {
                include "*.jar"
                exclude "*-sources.jar"
            }.files.findAll {
                it.name.contains("-${expectedVersion}.jar")
            }

            if (candidates.size() != 1) {
                throw new GradleException(
                        "Expected exactly one release JAR for ${variant} version ${expectedVersion}, " +
                                "but found: ${candidates*.name}"
                )
            }

            copy {
                from candidates.first()
                into layout.projectDirectory.dir("builds/${loader}")
            }
        }
    }
}
